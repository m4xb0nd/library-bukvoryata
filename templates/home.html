{{define "content"}}

  <span class="line-2">книги, которые</span>
  <span class="line-3">кто-то оставил...</span>

<p>В каталоге названий: {{.Data.Titles}}, сейчас на руках: {{.Data.ActiveLoans}}.</p>

<div class="heroes">

  <img src="/static/img/книга2.png" alt="Книга-зомби">
</div>
{{end}}
