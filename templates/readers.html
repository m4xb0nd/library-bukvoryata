{{define "content"}}
<form method="get" action="/readers" class="row">
  <input type="search" name="q" value="{{.Data.Q}}" placeholder="ФИО или номер билета">
  <button class="button">Найти</button>
  <a class="button alt" href="/readers/new">Новый читатель</a>
</form>

{{if .Data.Readers}}
<table>
  <tr><th>Билет</th><th>ФИО</th><th>Телефон</th><th>На руках</th></tr>
  {{range .Data.Readers}}
  <tr>
    <td>{{.Ticket}}</td>
    <td><a href="/readers/{{.ID}}">{{.FullName}}</a></td>
    <td>{{.Phone}}</td>
    <td>{{.Active}}</td>
  </tr>
  {{end}}
</table>
{{else}}
<p>Читатели не найдены.</p>
{{end}}
{{end}}
