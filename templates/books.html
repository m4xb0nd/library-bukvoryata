{{define "content"}}
<form method="get" action="/books" class="row">
  <input type="search" name="q" value="{{.Data.Q}}" placeholder="Название или автор">
  <select name="genre">
    <option value="0">Все жанры</option>
    {{range .Data.Genres}}<option value="{{.ID}}"{{if eq .ID $.Data.Genre}} selected{{end}}>{{.Name}}</option>{{end}}
  </select>
  <button class="button">Найти</button>
  {{if .IsAdmin}}<a class="button alt" href="/books/new">Добавить книгу</a>{{end}}
</form>

{{if .Data.Books}}
<table>
  <tr><th>Название</th><th>Автор</th><th>Жанр</th><th>Год</th><th>Свободно</th></tr>
  {{range .Data.Books}}
  <tr>
    <td><a href="/books/{{.ID}}">{{.Title}}</a></td>
    <td>{{.Author}}</td>
    <td>{{.Genre}}</td>
    <td>{{.Year}}</td>
    <td>{{if gt .Available 0}}{{.Available}} из {{.Copies}}{{else}}нет{{end}}</td>
  </tr>
  {{end}}
</table>
{{else}}
<div class="with-picture">
  <p>Ничего не найдено.</p>
  <img src="/static/img/book-zombie.png" alt="Книга-зомби">
</div>
{{end}}
{{end}}
